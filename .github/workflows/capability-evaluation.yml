name: Offline capability boundaries
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend/tests
      - run: python -m unittest discover -s evaluation -p 'test_*.py'
      - run: python -m evaluation.run --output /tmp/offline-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-boundary-results
          path: /tmp/offline-evaluation.json
